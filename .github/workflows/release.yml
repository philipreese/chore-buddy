name: Release

# Personal sideload distribution (ADR-0001): tagging a commit `v*` builds
# the Flutter app in app/ and attaches release APKs to a GitHub Release for
# `adb install`. No Play Store involved.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter test
        working-directory: app
        run: flutter test

      # --- Release signing ----------------------------------------------
      # Reads these repo Actions secrets (already provisioned):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # If they're ever absent the step is skipped and the build falls
      # back to the Flutter debug keystore (see
      # app/android/app/build.gradle.kts).
      # The `secrets` context is not permitted in a step-level `if`
      # (GitHub rejects the whole workflow file with a 0s failed run), so
      # the secret is routed through `env` and the condition tests that.
      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > app/android/key.properties

      - name: flutter build apk --release --split-per-abi
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes
