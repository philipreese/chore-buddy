name: Release

# Personal sideload distribution (ADR-0001): tagging a commit `v*` builds
# the Flutter app in app/ and attaches release APKs to a GitHub Release for
# `adb install`. No Play Store involved.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter test
        working-directory: app
        run: flutter test

      # --- Release signing (optional) -----------------------------------
      # TODO(human): today this step is a no-op and the release build below
      # falls back to the Flutter debug keystore (see
      # app/android/app/build.gradle.kts) -- fine for personal sideload,
      # but every retagged release will carry a different debug key unless
      # a real keystore is provisioned. To sign with a stable keystore
      # instead, add these secrets in repo Settings > Secrets and
      # variables > Actions, then this step picks them up automatically:
      #   ANDROID_KEYSTORE_BASE64    -- `base64 -w0 your-release.jks`
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      - name: Configure release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > app/android/key.properties

      - name: flutter build apk --release --split-per-abi
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes
